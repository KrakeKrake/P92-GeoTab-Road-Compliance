services:
  postgis:
    image: pgrouting/pgrouting:18-3.6-4.0
    container_name: ${DB_CONTAINER}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    command: postgres -c listen_addresses='*'
    volumes:
      - pgrouting_data:/var/lib/postgresql
    ports:
      - "${DB_PORT}:5432"
    networks:
      - nhvr_compliance_default

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "5433:8080"
    restart: unless-stopped
    depends_on:
      - postgis
    networks:
      - nhvr_compliance_default

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    user: 1000:1000
    container_name: valhalla
    ports:
      - 8002:8002
    networks:
      - nhvr_compliance_default
    volumes:
      - ./valhalla_custom_files:/custom_files:Z
      - ./gtfs_feeds:/gtfs_feeds:Z

volumes:
  pgrouting_data:

networks:
  nhvr_compliance_default:
    driver: bridge
    name: nhvr_compliance_default
