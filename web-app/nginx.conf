server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Valhalla. The trailing slash on proxy_pass strips /valhalla/.
    location /valhalla/ {
        proxy_pass http://valhalla:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Routes can take a while on large extracts.
        proxy_read_timeout 300s;
    }

    # Compliance API. No trailing slash: the routes already include /api/.
    location /api/ {
        proxy_pass http://compliance-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Written at container start; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Vite output is content-hashed.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routes (/directions, /isochrones, /tiles) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
