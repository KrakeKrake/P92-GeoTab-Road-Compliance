# Loaded automatically by `docker compose` command in this directory.
# Keeps the build contexts out of docker-compose.yml so that file can also be
# used unchanged as the deployment definition.
services:
  postgis:
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${DB_DEBUG_PORT:-5432}:5432"

  compliance-api:
    build:
      context: ./db
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${API_DEBUG_PORT:-5000}:5000"

  valhalla:
    build:
      context: ./nhvr-valhalla
      dockerfile: docker/Dockerfile-nhvr
      args:
        CONCURRENCY: ${VALHALLA_BUILD_CONCURRENCY:-}
        BUILD_TYPE: ${VALHALLA_BUILD_TYPE:-Release}
    ports:
      - "127.0.0.1:${VALHALLA_DEBUG_PORT:-8002}:8002"

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile

  nhvr-tools:
    build:
      context: ./nhvr-valhalla/run/nhvr-importer
      dockerfile: Dockerfile
